name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: scheduler
          POSTGRES_PASSWORD: scheduler_test
          POSTGRES_DB: scheduler_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scheduler -d scheduler_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgresql://scheduler:scheduler_test@localhost:5432/scheduler_test
      TEST_DATABASE_URL: postgresql://scheduler:scheduler_test@localhost:5432/scheduler_test
      TEST_REDIS_URL: redis://localhost:6379
      API_BASE_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:validate
      - run: npm run db:deploy
      - run: npm run check
      - run: npm run test:integration
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
